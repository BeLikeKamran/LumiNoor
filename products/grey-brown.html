<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grey Brown — LumiNoor</title>

<!-- This page exists ONLY so link previews (WhatsApp, Facebook, iMessage...)
     show THIS product's photo. Preview crawlers read these tags from the
     raw HTML without running any JavaScript, so each product needs its own
     small file like this one with its own og:image. Visitors themselves
     never really "land" here — see the redirect below. -->
<meta property="og:title" content="Grey Brown — LumiNoor">
<meta property="og:description" content="Rs.999 PKR · Soft, comfort-fit doll lens · Order over WhatsApp.">
<meta property="og:image" content="https://belikekamran.github.io/LumiNoor/assets/Grey_Brown.jpg">
<meta property="og:url" content="https://belikekamran.github.io/LumiNoor/products/grey-brown.html">
<meta property="og:type" content="website">

<!-- Instant redirect back to the real shop page, scrolled to this product.
     The meta refresh covers browsers with JS disabled; the script covers
     everyone else and fires immediately. -->
<meta http-equiv="refresh" content="0; url=../index.html#grey-brown">
<script>window.location.replace("../index.html#grey-brown");</script>
</head>
<body>
  <p>Redirecting to <a href="../index.html#grey-brown">Grey Brown on LumiNoor</a>…</p>
</body>
</html>
