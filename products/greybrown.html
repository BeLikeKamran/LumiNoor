<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grey Brown — LumiNoor</title>

<!-- This page exists ONLY so link previews (WhatsApp, Facebook, iMessage...)
     show THIS product's photo. Preview crawlers read these tags from the
     raw HTML without running any JavaScript, so each product needs its own
     small file like this one with its own og:image. Visitors themselves
     never really "land" here — see the redirect below. -->
<meta property="og:title" content="Grey Brown — LumiNoor">
<meta property="og:description" content="Rs.999 PKR · Soft, comfort-fit doll lens · Order over WhatsApp.">
<meta property="og:image" content="https://luminoor.github.io/luminoor/assets/GreyBrown.jpg">
<meta property="og:url" content="https://luminoor.github.io/luminoor/products/greybrown.html">
<meta property="og:type" content="website">

<!-- Redirect normal visitors back to the real shop page after crawlers have
     had time to read this page's product-specific preview metadata. -->
<script>setTimeout(() => window.location.replace("../index.html#greybrown"), 1500);</script>
</head>
<body>
  <p>Redirecting to <a href="../index.html#greybrown">Grey Brown on LumiNoor</a>…</p>
</body>
</html>
